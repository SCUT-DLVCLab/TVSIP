### model
model_name_or_path: saves/tvsip_interpreter_stage1/ep1
trust_remote_code: False

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all

### dataset
dataset: tvsip_interpreter_stage1
template: qwen2_vl
cutoff_len: 4096
image_max_pixels: 1204224
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 100

### output
output_dir: saves/tvsip_interpreter_stage2_test
logging_steps: 10
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
val_size: 10
per_device_eval_batch_size: 1
eval_strategy: epoch
